<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow" />
  <title>Cuenta Fácil Support</title>
  <style>
@font-face { font-family: "Newsreader"; src: url("../fonts/cuenta-facil/Newsreader-MediumItalic.ttf") format("truetype"); font-weight: 500; font-style: italic; font-display: swap; }
@font-face { font-family: "Newsreader"; src: url("../fonts/cuenta-facil/Newsreader-BoldItalic.ttf") format("truetype"); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: "Hanken Grotesk"; src: url("../fonts/cuenta-facil/HankenGrotesk-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Hanken Grotesk"; src: url("../fonts/cuenta-facil/HankenGrotesk-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Hanken Grotesk"; src: url("../fonts/cuenta-facil/HankenGrotesk-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }
:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
body { min-height: 100vh; margin: 0; color: var(--muted); background: var(--bg); }
.privacy-page { isolation: isolate; min-height: 100vh; padding: clamp(1rem, 4vw, 4rem); overflow: hidden; }
.glow { position: fixed; z-index: -1; width: min(52vw, 680px); aspect-ratio: 1; border-radius: 50%; filter: blur(80px); opacity: .22; pointer-events: none; }
.glow--one { top: -15rem; right: -12rem; background: var(--primary); }
.glow--two { bottom: -20rem; left: -14rem; background: var(--secondary); }
.privacy-policy { width: min(100%, 860px); margin: 0 auto; padding: clamp(1.5rem, 5vw, 4.5rem); background: var(--surface); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); }
.header, .brand, .language { display: flex; align-items: center; }
.header { justify-content: space-between; gap: 1rem; padding-bottom: 2rem; border-bottom: 1px solid var(--line); }
.brand { gap: .85rem; }
.logo { width: 48px; height: 48px; border-radius: 14px; box-shadow: var(--logo-shadow); }
.eyebrow { display: block; color: var(--text); font-size: 1.1rem; font-weight: 700; }
.brand p { margin: .1rem 0 0; font-size: .82rem; color: var(--muted); }
.language { padding: .25rem; gap: .15rem; background: var(--language-bg); border: 1px solid var(--line); border-radius: 12px; }
.language button { min-width: 2.7rem; padding: .45rem .5rem; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 700 .75rem inherit; letter-spacing: .04em; cursor: pointer; }
.language button:hover, .language button:focus-visible { color: var(--text); }
.language button:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
.language button[aria-pressed="true"] { background: var(--primary); color: var(--active-text); }
.intro { padding: clamp(2.25rem, 6vw, 4.5rem) 0 2.5rem; }
h1, h2 { color: var(--text); letter-spacing: -.025em; }
h1 { max-width: 680px; margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.08; }
.intro p { max-width: 650px; margin: 1.25rem 0 0; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.7; }
.content { display: grid; gap: 2.25rem; }
.content section { padding-top: 2.25rem; border-top: 1px solid var(--line); }
h2 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
.content p, .content li { font-size: .98rem; line-height: 1.75; }
.content p { margin: .9rem 0 0; }
.content ul { margin: .9rem 0 0 1.25rem; padding: 0; }
.content li + li { margin-top: .55rem; }
a { color: var(--secondary); font-weight: 600; text-underline-offset: .2em; }
a:hover { color: var(--primary-soft); }
.contact { padding: 1.5rem !important; border: 1px solid var(--contact-border) !important; border-radius: 16px; background: var(--contact-bg); }
.contact p { margin-top: .6rem; }
@media (max-width: 560px) { .privacy-page { padding: 0; } .privacy-policy { border-right: 0; border-left: 0; border-radius: 0; } .header { align-items: flex-start; flex-direction: column; } }


:root { color-scheme:light; --bg:#eceeea; --surface:#f8f9f6; --primary:#a82b18; --secondary:#a82b18; --primary-soft:#cc3621; --text:#15181c; --muted:#454b52; --border:#c9cec7; --line:#c9cec7; --language-bg:#eceeea; --shadow:0 18px 50px rgba(21,24,28,.08); --logo-shadow:0 6px 18px rgba(21,24,28,.18); --contact-border:#c9cec7; --contact-bg:#eceeea; --active-text:#ffffff; --serif:Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif; --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
h1, h2, .eyebrow { font-family: var(--serif); font-style: italic; }
h1, h2 { font-weight: 500; }
.eyebrow { font-weight: 700; }
body { font-family: var(--sans); }
.glow { opacity: .1; }
.logo { border-radius: 22%; }
</style>
</head>
<body>
  <main class="privacy-page">
    <div class="glow glow--one"></div><div class="glow glow--two"></div>
    <article class="privacy-policy">
      <header class="header">
        <div class="brand"><img src="assets/cuenta-facil.png" alt="Cuenta Fácil" class="logo" /><div><span class="eyebrow">Cuenta Fácil</span><p id="page-label"></p></div></div>
        <div class="language" id="language-selector" aria-label="Language">
          <button type="button" data-locale="en" aria-pressed="true">EN</button>
          <button type="button" data-locale="es" aria-pressed="false">ES</button>
        </div>
      </header>
      <div class="intro"><h1 id="title"></h1><p id="intro"></p></div>
      <div class="content" id="content"></div>
    </article>
  </main>
  <script>
const supportCopy = {
	en: {
		languageLabel: "Language",
		pageLabel: "Support",
		title: "Cuenta Fácil Support",
		intro: "Answers to common questions, and how to reach us for anything else.",
		sections: [
			{
				title: "How do I add an expense?",
				paragraphs: [
					"Open the expense composer and write or dictate what happened, for example who paid and how much. The app turns it into a draft that you review and can edit before saving. Nothing is saved until you confirm it.",
				],
			},
			{
				title: "How do I tag people with @?",
				paragraphs: [
					"Type @ in the composer to pick a person. Suggestions come first from people you already share expenses with, then from your device contacts if you allowed contact access. You can also add people by typing their name and then choosing their phone number or email.",
				],
			},
			{
				title: "How do I split a bill?",
				paragraphs: [
					"Choose the people involved and how the bill is divided. You can review each person's share on the draft before you save, and see who paid and what each person owes afterwards.",
				],
			},
			{
				title: "How do groups work?",
				paragraphs: [
					"Groups keep the expenses of a trip or a recurring plan together. Create a group, invite people with a link, and add expenses to it. Members of a group can see the group's expenses and balances.",
				],
			},
			{
				title: "Which currencies are supported?",
				paragraphs: [
					"Cuenta Fácil currently supports COP and USD. Balances are shown by currency; the app does not convert between them.",
				],
			},
			{
				title: "How do I record a payment or attach a receipt?",
				paragraphs: [
					"Open an expense and record a payment to follow what is still outstanding. You can attach a photo of the receipt or of the payment evidence from your camera or photo library. The app does not move money; it keeps the record.",
				],
			},
			{
				title: "How do I delete my account?",
				paragraphs: [
					"Go to Profile in the app and choose Delete account. You will be asked to confirm, and the action cannot be undone. Shared expenses and groups that involve other people may remain visible to them.",
				],
				link: {
					before: "You can also read the ",
					label: "account deletion page",
					href: "/apps/cf/delete-account.html",
					after: " or email us to request deletion.",
				},
			},
			{
				title: "What happens to my data?",
				paragraphs: ["Everything about what the app collects, who processes it and how long it is kept is in the privacy policy."],
				link: {
					before: "Read the ",
					label: "Cuenta Fácil privacy policy",
					href: "/privacy/cuenta-facil.html",
					after: ".",
				},
			},
		],
		contactTitle: "Still stuck?",
		contactText: "Write to us and we'll help. If it's a bug, include your device model and iOS/Android version.",
	},
	es: {
		languageLabel: "Idioma",
		pageLabel: "Soporte",
		title: "Soporte de Cuenta Fácil",
		intro: "Respuestas a preguntas frecuentes, y cómo contactarnos para cualquier otra cosa.",
		sections: [
			{
				title: "¿Cómo agrego un gasto?",
				paragraphs: [
					"Abre el compositor de gastos y escribe o dicta lo que pasó, por ejemplo quién pagó y cuánto. La app lo convierte en un borrador que revisas y puedes editar antes de guardar. No se guarda nada hasta que lo confirmes.",
				],
			},
			{
				title: "¿Cómo etiqueto personas con @?",
				paragraphs: [
					"Escribe @ en el compositor para elegir a una persona. Las sugerencias vienen primero de las personas con las que ya compartes gastos y luego de los contactos de tu dispositivo, si permitiste el acceso a contactos. También puedes agregar personas escribiendo su nombre y eligiendo después su teléfono o correo.",
				],
			},
			{
				title: "¿Cómo divido una cuenta?",
				paragraphs: [
					"Elige a las personas involucradas y cómo se reparte la cuenta. Puedes revisar la parte de cada persona en el borrador antes de guardar, y ver después quién pagó y cuánto debe cada uno.",
				],
			},
			{
				title: "¿Cómo funcionan los grupos?",
				paragraphs: [
					"Los grupos reúnen los gastos de un viaje o de un plan recurrente. Crea un grupo, invita personas con un enlace y agrega gastos. Los miembros de un grupo pueden ver los gastos y saldos del grupo.",
				],
			},
			{
				title: "¿Qué monedas se admiten?",
				paragraphs: [
					"Cuenta Fácil admite actualmente COP y USD. Los saldos se muestran por moneda; la app no convierte entre ellas.",
				],
			},
			{
				title: "¿Cómo registro un pago o adjunto un recibo?",
				paragraphs: [
					"Abre un gasto y registra un pago para seguir lo que queda pendiente. Puedes adjuntar una foto del recibo o del comprobante de pago desde tu cámara o fototeca. La app no mueve dinero; guarda el registro.",
				],
			},
			{
				title: "¿Cómo elimino mi cuenta?",
				paragraphs: [
					"Ve a Perfil en la app y elige Eliminar cuenta. Se te pedirá confirmar y la acción no se puede deshacer. Los gastos y grupos compartidos que involucran a otras personas pueden seguir visibles para ellas.",
				],
				link: {
					before: "También puedes leer la ",
					label: "página de eliminación de cuenta",
					href: "/apps/cf/delete-account.html",
					after: " o escribirnos para solicitar la eliminación.",
				},
			},
			{
				title: "¿Qué pasa con mis datos?",
				paragraphs: ["Todo sobre lo que recopila la app, quién lo procesa y cuánto tiempo se conserva está en la política de privacidad."],
				link: {
					before: "Lee la ",
					label: "política de privacidad de Cuenta Fácil",
					href: "/privacy/cuenta-facil.html",
					after: ".",
				},
			},
		],
		contactTitle: "¿Todavía tienes dudas?",
		contactText: "Escríbenos y te ayudamos. Si es un error, incluye el modelo de tu dispositivo y la versión de iOS/Android.",
	},
};
    const pageLabel = document.querySelector('#page-label');
    const title = document.querySelector('#title');
    const intro = document.querySelector('#intro');
    const content = document.querySelector('#content');
    const selector = document.querySelector('#language-selector');

    function addText(parent, tag, value) {
      const element = document.createElement(tag);
      element.textContent = value;
      parent.append(element);
    }

    function render(locale) {
      const copy = supportCopy[locale];
      document.documentElement.lang = locale;
      document.title = copy.title;
      pageLabel.textContent = copy.pageLabel;
      title.textContent = copy.title;
      intro.textContent = copy.intro;
      selector.setAttribute('aria-label', copy.languageLabel);
      content.replaceChildren();
      for (const section of copy.sections) {
        const sectionElement = document.createElement('section');
        addText(sectionElement, 'h2', section.title);
        for (const paragraph of section.paragraphs ?? []) addText(sectionElement, 'p', paragraph);
        if (section.link) {
          const linkParagraph = document.createElement('p');
          const anchor = document.createElement('a');
          anchor.href = section.link.href;
          anchor.textContent = section.link.label;
          linkParagraph.append(document.createTextNode(section.link.before), anchor, document.createTextNode(section.link.after));
          sectionElement.append(linkParagraph);
        }
        content.append(sectionElement);
      }
      const contact = document.createElement('section');
      contact.className = 'contact';
      addText(contact, 'h2', copy.contactTitle);
      const contactParagraph = document.createElement('p');
      contactParagraph.append(document.createTextNode(`${copy.contactText} `));
      const email = document.createElement('a');
      email.href = 'mailto:khrienanime@gmail.com';
      email.textContent = 'khrienanime@gmail.com';
      contactParagraph.append(email, document.createTextNode('.'));
      contact.append(contactParagraph);
      content.append(contact);
      for (const button of selector.querySelectorAll('button')) {
        button.setAttribute('aria-pressed', String(button.dataset.locale === locale));
      }
    }

    selector.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-locale]');
      if (button) render(button.dataset.locale);
    });
    render('en');
  </script>
</body>
</html>
